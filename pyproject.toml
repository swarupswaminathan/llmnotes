[project]
name = "gllaucomed"
version = "0.1.0"
description = "GLLaucoMed — LLM pipeline for glaucoma medication extraction from clinical notes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "pandas>=2.3.0",
    "openpyxl>=3.1.5",
    "numpy>=2.0.0",
    "tqdm>=4.67.1",
    "rapidfuzz>=3.0.0",
    "requests>=2.31.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.7.0",
    "statsmodels>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
